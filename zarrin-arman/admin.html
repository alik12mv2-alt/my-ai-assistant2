<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>پنل مدیریت زرین آرمان (نسخه محلی)</title>
<style>
:root{--gold:#b58a35;--ink:#302719;--paper:#fbf8f1;--line:#e8dfce}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Tahoma,Arial,sans-serif}header{background:#292318;color:#fff;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}header b{color:#e8c879;font-size:19px}header a{color:#f4dfaa}.wrap{max-width:1000px;margin:24px auto;padding:0 15px}.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px;margin-bottom:16px;box-shadow:0 5px 22px #38290b0a}h1,h2{margin:0 0 12px}h1{font-size:21px}h2{font-size:17px}.note{background:#fff7df;padding:12px;border-radius:10px;font-size:13px;line-height:1.9;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}label{display:block;font-size:13px;margin-bottom:5px}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink)}textarea{min-height:75px}button{border:0;border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer;background:var(--gold);color:#fff}button.secondary{background:#eee8dc;color:var(--ink)}button.danger{background:#a94438}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.products{display:grid;gap:10px}.product{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);padding:12px;border-radius:12px}.product img{width:76px;height:76px;object-fit:cover;border-radius:10px}.product small{display:block;color:#786f60;margin-top:4px}.badge{font-size:11px;background:#f2ead8;padding:4px 8px;border-radius:20px}@media(max-width:600px){.grid{grid-template-columns:1fr}.product{align-items:flex-start;flex-direction:column}}
</style></head>
<body>
<header><b>زرین آرمان | مدیریت کاتالوگ</b><a href="./index.html">بازگشت به سایت</a></header>
<main class="wrap">
<section class="panel"><div class="note"><strong>نسخه محلی و آزمایشی:</strong> محصولات در همین مرورگر ذخیره می‌شوند؛ با دستگاه دیگر همگام نیستند و این پنل به فروش یا پرداخت واقعی متصل نیست. برای انتقال محصولات به سایت عمومی، اتصال پایگاه داده جداگانه لازم است.</div>
<h1 id="formTitle">ثبت محصول کاتالوگ</h1>
<form id="productForm"><input type="hidden" id="pid">
<div class="grid">
<div><label>نام محصول</label><input id="name" required maxlength="100"></div>
<div><label>دسته‌بندی</label><select id="category"><option>انگشتر</option><option>گردنبند</option><option>دستبند</option><option>گوشواره</option><option>سکه و شمش (نمایشی)</option><option>سایر</option></select></div>
<div><label>قیمت نمایشی (تومان)</label><input id="price" type="number" min="0"></div>
<div><label>وزن (گرم)</label><input id="weight" type="number" min="0" step="0.001"></div>
<div><label>عیار (اطلاعاتی)</label><input id="karat" value="۱۸ عیار"></div>
<div><label>تصویر محصول (انتخاب فایل)</label><input id="photo" type="file" accept="image/*"></div>
</div><div style="margin-top:12px"><label>توضیحات</label><textarea id="desc"></textarea></div>
<div class="actions"><button type="submit">ذخیره محصول</button><button type="button" class="secondary" id="cancel">فرم جدید</button></div></form></section>
<section class="panel"><h2>محصولات ثبت‌شده</h2><div id="list" class="products"></div><div class="actions"><button class="secondary" id="export">خروجی پشتیبان JSON</button><button class="secondary" id="importBtn">واردکردن پشتیبان</button><input id="backupFile" type="file" accept=".json,application/json" hidden></div></section>
</main>
<script>
const $=id=>document.getElementById(id);const KEY="zarrin_arman_local_catalog";let items=[];try{items=JSON.parse(localStorage.getItem(KEY)||"[]")}catch{items=[]}
let photoData="";
function save(){try{localStorage.setItem(KEY,JSON.stringify(items));render()}catch(e){alert("فضای ذخیره مرورگر کافی نیست. تصویر کوچک‌تری انتخاب کنید.")}}
function reset(){ $("productForm").reset();$("pid").value="";$("karat").value="۱۸ عیار";photoData="";$("formTitle").textContent="ثبت محصول کاتالوگ"}
$("photo").onchange=()=>{const f=$("photo").files[0];if(!f)return;if(f.size>800000){alert("حجم تصویر بیشتر از ۸۰۰ کیلوبایت است؛ تصویر کوچک‌تر انتخاب کنید.");$("photo").value="";return}const reader=new FileReader();reader.onload=()=>photoData=reader.result;reader.readAsDataURL(f)}
$("productForm").onsubmit=e=>{e.preventDefault();const id=$("pid").value;const old=items.find(x=>x.id===id);const p={id:id||String(Date.now()),name:$("name").value.trim(),category:$("category").value,price:$("price").value,weight:$("weight").value,karat:$("karat").value,description:$("desc").value,image:photoData||old?.image||""};if(id)items=items.map(x=>x.id===id?p:x);else items.unshift(p);save();reset()}
$("cancel").onclick=reset;
function render(){const list=$("list");list.innerHTML="";if(!items.length){list.textContent="هنوز محصولی اضافه نشده.";return}items.forEach(p=>{const row=document.createElement("article");row.className="product";if(p.image){const img=document.createElement("img");img.src=p.image;img.alt="تصویر "+p.name;row.append(img)}const info=document.createElement("div");const title=document.createElement("strong");title.textContent=p.name;const meta=document.createElement("small");meta.textContent=p.category+" | "+(p.weight||"—")+" گرم | "+(p.price||"—")+" تومان";const desc=document.createElement("small");desc.textContent=p.description||"";info.append(title,meta,desc);const buttons=document.createElement("div");buttons.className="actions";const edit=document.createElement("button");edit.className="secondary";edit.textContent="ویرایش";edit.onclick=()=>{$("pid").value=p.id;$("name").value=p.name;$("category").value=p.category;$("price").value=p.price;$("weight").value=p.weight;$("karat").value=p.karat;$("desc").value=p.description;photoData=p.image||"";$("formTitle").textContent="ویرایش محصول";window.scrollTo({top:0,behavior:"smooth"})};const del=document.createElement("button");del.className="danger";del.textContent="حذف";del.onclick=()=>{if(confirm("این محصول حذف شود؟")){items=items.filter(x=>x.id!==p.id);save()}};buttons.append(edit,del);row.append(info,buttons);list.append(row)})}
$("export").onclick=()=>{const blob=new Blob([JSON.stringify(items,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="zarrin-arman-catalog-backup.json";a.click();URL.revokeObjectURL(a.href)}
$("importBtn").onclick=()=>$("backupFile").click();$("backupFile").onchange=()=>{const f=$("backupFile").files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!Array.isArray(data))throw new Error();items=data;save();alert("پشتیبان وارد شد")}catch{alert("فایل پشتیبان معتبر نیست")}};reader.readAsText(f)}
render();
</script></body></html>
